<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie des Champions</title>
    <link rel="stylesheet" href="style.css">
    <script src="resultat.js" defer></script>
</head>

<body>

    <header>
        <a href="index.html"> 
            <img src="img/logoV2.png" alt="Logo MDC" weight="64" height="64"> 
        </a>

        <a href="connexion.html">Se connecter</a>
    </header>
    
    <nav>
        <p><a href="index.html">Accueil</a></p>
        <p><a href="conversation.html">Messagerie</a></p>
        <p><a href="resultat.html">Résultats</a></p>
        <p>Paramètres</p>
    </nav>

    <div>
        <h1> Messagerie des champions </h1> <br>
    </div>    

    <div>
        <h2>Résultats</h2>
    </div>

    <div class="choix-equipe">
        <h3><label for="equipe">Ton équipe favorite</label></h3>
        <select id="equipe" name="equipe">
            <option value="">-- Choisis une équipe --</option>
            <option value="atletico">Atlético Madrid</option>
            <option value="bayern">Bayern Munich</option>
            <option value="real">Real Madrid</option>
            <option value="psg">Paris Saint-Germain</option>
            <option value="barca">FC Barcelone</option>
            <option value="liverpool">Liverpool</option>
            <option value="city">Manchester City</option>
            <option value="inter">Inter Milan</option>
        </select>
    </div>

    <section class="bloc-resultats" aria-labelledby="titre-resultats">
        <h2 id="titre-resultats">Les 5 derniers résultats en LDC</h2>
        <p class="intro-resultats">Sélectionne une équipe pour consulter ses cinq derniers matchs terminés.</p>

        <div class="legende-resultats" aria-label="Légende">
            <span><span class="pastille-resultat V">V</span> Victoire</span>
            <span><span class="pastille-resultat N">N</span> Match nul</span>
            <span><span class="pastille-resultat D">D</span> Défaite</span>
        </div>

        <div class="actions-resultats">
            <button id="actualiser" type="button" disabled>Actualiser les résultats</button>
            <p id="statut-resultats" class="statut-resultats" role="status" aria-live="polite">Choisis une équipe.</p>
        </div>

        <div id="liste-resultats" class="liste-resultats" aria-live="polite"></div>
    </section>

    <footer>© 2026 Messagerie des Champions</footer>
    
</body>

</html>
