<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Messagerie des Champions</title>
    <link rel="icon" href="data:,">

    <!-- Initialisation de l'environnement comme dans la version du professeur. -->
    <script src="js/local.js"></script>

    <!-- On conserve le style original de Messagerie des Champions. -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/spclient.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/signin.js" defer></script>
</head>
<body>
    <header class="page-header">
        <a href="index.html">
            <img src="img/logoV2.png" alt="Logo Messagerie des Champions" width="64" height="64">
        </a>
    </header>

    <main class="signin">
        <h1>Messagerie Des Champions</h1>

        <form id="form-signin">
            <h2>Connexion</h2>

            <label for="email">Adresse mail :</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Se connecter</button>
            <button id="submit" type="button">S'inscrire</button>
            <p id="auth-message" role="status" aria-live="polite"></p>
        </form>
        
    </main>

    <footer class="page-footer">
        <p>© 2026 Messagerie des Champions</p>
    </footer>
</body>
</html>
