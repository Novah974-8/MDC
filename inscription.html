<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie des Champions</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <header>
        <a href="index.html"> 
            <img src="img/logoV2.png" alt="Logo MDC" weight="64" height="64"> 
        </a>
        
    </header>
    <h1> Messagerie des champions </h1> <br>
    

    <form action="/upload" method="post">
        <h2>Inscription</h2>

        <label for="email">Adresse mail :</label>
        <input type="email" id="email" name="email" required> <br>

        <label for="equipe_fav">Equipe favorite :</label>
        <input type="text" id="equipe_fav" name="equipe_fav" required> <br>

        <label for="mot_de_passe">Mot de passe :</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" required> <br>

        <button type="submit">S'inscrire</button>
    </form>

    
    <footer>© 2026 Messagerie des Champions</footer>

</body>

</html>
